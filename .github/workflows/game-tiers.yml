# Tiers 1 through 3, on a runner that has to build the game first.
#
# Needs two repository secrets, TERRARIA_OWNERSHIP_KEY and
# SETUP_ASSETS_PASSPHRASE. Without them the decompile step fails; the
# comment on that step says where the key comes from.
#
# The core tiers need only the SDK and are covered by ci.yml on three
# operating systems. Everything above tier 0 needs a tModLoader install, and a
# hosted runner has none, so this job builds one: decompile Terraria, apply
# tModLoader's patches, compile, and only then run the gates.
#
# One Linux job rather than two runners. tModLoader builds themselves on
# windows-latest, which left the Linux path unproven, so every step below was
# rehearsed locally first against a scratch clone of the 1.4.5 branch: the
# decompile, the patches (no failures and no fuzz), the Release build, and
# both Testaria gate suites against the result. See PLAN.md section 8.7a.
#
# TIER 3 WITHOUT OWNING TERRARIA
#
# A client will not start unless a content directory sits beside the install,
# and Terraria's is 755 MB available only from an owned copy. It does not
# follow that a runner needs one. The check tests that two paths exist and
# never opens them, and nothing in the suite asks for a vanilla asset, so two
# empty files named after them satisfy a client completely: measured by
# trimming 755 MB to nothing a row at a time with tier 3 green at every step,
# the last of those rows being this configuration exactly (PLAN.md 8.7d).
#
# So this job creates a stub and covers every gate. Two caveats, both real.
# The stub defeats a check meant to tell a person their Terraria is out of
# date, which is harmless where there is no person and no Terraria, and must
# never be done on top of an installation. And it measures the suite that
# exists: the first test that wants a real texture will need real content,
# which is what PLAN.md 8.7c is for and where 8.9 is going.

name: Game tiers

on:
  # The first run pays for a decompile and every later one restores it from
  # the cache, so a warm run is a build plus roughly five minutes of gates.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: game-tiers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-tiers:
    name: Tiers 1 through 3
    runs-on: ubuntu-latest
    # A cold run decompiles Terraria, which is the slow step the cache exists
    # to avoid. Warm runs are a build plus roughly five minutes of gates.
    timeout-minutes: 120

    env:
      # 1.4.5.8 with the dots removed, which is how the setup tool builds the
      # download URL (TerrariaDecompileExecutableProvider).
      #
      # Only the decompile is fed from here, and for that this is right. Note
      # that the 1.4.5 head disagrees with itself: the setup tool decompiles
      # 1.4.5.8 while the InstallVerifier in the generated source expects
      # Terraria 1.4.5.6. That mismatch stops the build dead when a real
      # installation sits beside it, and is invisible here only because the
      # stub arrangement below never reaches the executable check. Anything
      # that later puts a real Terraria beside the build has to match
      # InstallVerifier, and the two are not currently the same number.
      TERRARIA_VERSION: '1458'
      TMOD_BRANCH: '1.4.5'

    steps:
      - name: Check out Testaria
        uses: actions/checkout@v4
        with:
          path: Testaria

      - name: Check out tModLoader
        uses: actions/checkout@v4
        with:
          repository: tModLoader/tModLoader
          ref: ${{ env.TMOD_BRANCH }}
          path: tModLoader
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Xvfb is the one package the runner lacks. rsync, python3 and flock are
      # already present; scripts/ci-local.sh preflights all of them and names
      # whatever is missing rather than failing inside a gate.
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      # The decompiled tree is Terraria's own code and must not be published,
      # so it is cached encrypted, exactly as tModLoader's CI does it. The key
      # ends in a letter to be bumped by hand when ILSpy or the decompile
      # settings change and the cached output stops being what a fresh run
      # would produce.
      - name: Restore the decompiled cache
        id: decompiled-cache
        uses: actions/cache@v4
        with:
          path: tModLoader/decompiled.zip.gpg
          key: decompiled-${{ env.TERRARIA_VERSION }}-A

      - name: Unpack the decompiled cache
        if: steps.decompiled-cache.outputs.cache-hit == 'true'
        working-directory: tModLoader
        run: |
          gpg --quiet --batch --yes --decrypt \
            --passphrase="$SETUP_ASSETS_PASSPHRASE" \
            --output decompiled.zip decompiled.zip.gpg
          unzip -q -o decompiled.zip -d src
        env:
          SETUP_ASSETS_PASSPHRASE: ${{ secrets.SETUP_ASSETS_PASSPHRASE }}

      # Only the Windows TerrariaServer.exe is wanted here, as the decompile's
      # reference point. The setup tool will fetch this zip itself if it has
      # to; downloading it explicitly keeps the version pinned to the one this
      # job names, and gives --terraria-steam-dir something to validate.
      - name: Fetch the Terraria dedicated server
        run: |
          curl -sS -L -o terrariaserver.zip \
            "https://terraria.org/api/download/pc-dedicated-server/terraria-server-${TERRARIA_VERSION}.zip"
          unzip -q terrariaserver.zip -d terraria
          test -f "terraria/${TERRARIA_VERSION}/Windows/TerrariaServer.exe"

      # Decompiling a .NET Framework 4.0 assembly needs Framework reference
      # assemblies, and a Linux runner has none: without them ILSpy stops with
      # "Version not supported: 4.0.0.0". The setup tool fetches this very
      # package itself, but only when an mscorlib.dll sits beside Terraria,
      # which is what a Mono-style install looks like. That is why a rehearsal
      # against a Steam install passed, since Terraria's Linux build ships one;
      # the dedicated-server zip holds six files and none of them is it.
      #
      # So do both halves here. Staging the package where the tool looks first
      # pins the version and saves the download, and copying its mscorlib
      # beside the server executable is what turns the branch on.
      # RetrieveFrameworkRefs returns this directory as-is when it exists, so a
      # tModLoader that moves to another package version needs this step moved
      # with it, or the decompile silently uses the older references.
      - name: Provide .NET Framework reference assemblies
        run: |
          refs="${GITHUB_WORKSPACE}/tModLoader/setup/.NETFramework/v4.8.1"
          mkdir -p "$refs"

          curl -sS -L -o refassemblies.nupkg \
            "https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies.net481/1.0.3"

          # One pattern covers Facades/ too, since unzip's wildcards cross a
          # directory separator. The .xml documentation is left behind, as the
          # tool leaves it.
          unzip -q refassemblies.nupkg "build/.NETFramework/v4.8.1/*.dll" -d refassemblies
          cp -r refassemblies/build/.NETFramework/v4.8.1/. "$refs/"
          cp "$refs/mscorlib.dll" "terraria/${TERRARIA_VERSION}/Windows/mscorlib.dll"

          # What the decompile will reach for: the reference set, one of the
          # facades, and the file the branch is decided on.
          test -f "$refs/mscorlib.dll"
          test -f "$refs/Facades/netstandard.dll"
          test -f "terraria/${TERRARIA_VERSION}/Windows/mscorlib.dll"

      # The client executable is not in that zip and is not downloadable. It
      # ships in tModLoader's own repository as an encrypted blob, and the
      # ownership key decrypts it. The key proves you own Terraria; derive it
      # once locally with `./setup-cli.sh secrets reveal` and store it as a
      # repository secret. It must never be committed.
      #
      # NOTE: this is the one step in the job that has never been run. The
      # rehearsal machine had Terraria_v1.4.5.8_win.exe in its install, so the
      # setup tool short-circuited and the decrypt path was never exercised.
      # It is AES in .NET and the option exists for non-Windows hosts, so the
      # risk is low, but if this job fails somewhere unexpected, look here.
      - name: Decompile Terraria
        working-directory: tModLoader
        run: |
          if [ ! -d ./src/decompiled ]; then
            ./setup-cli.sh decompile \
              --key "$TERRARIA_OWNERSHIP_KEY" \
              --terraria-steam-dir "../terraria/${TERRARIA_VERSION}/Windows" \
              --tml-dev-steam-dir steam_build \
              --plain-progress -f --strict
          else
            echo "src/decompiled restored from cache, skipping the decompile"
            ./setup-cli.sh update-workspace-info \
              "../terraria/${TERRARIA_VERSION}/Windows" steam_build --no-validate
          fi
        env:
          TERRARIA_OWNERSHIP_KEY: ${{ secrets.TERRARIA_OWNERSHIP_KEY }}

      - name: Save the decompiled cache
        if: steps.decompiled-cache.outputs.cache-hit != 'true'
        working-directory: tModLoader
        run: |
          zip -q -r decompiled.zip ./src/decompiled
          gpg --quiet --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase="$SETUP_ASSETS_PASSPHRASE" decompiled.zip
        env:
          SETUP_ASSETS_PASSPHRASE: ${{ secrets.SETUP_ASSETS_PASSPHRASE }}

      # Applies every patch in patches/ to the decompiled tree, producing
      # src/Terraria, src/TerrariaNetCore and src/tModLoader. --strict so that
      # a patch applying with fuzz is an error rather than a warning nobody
      # reads.
      - name: Apply tModLoader's patches
        working-directory: tModLoader
        run: ./setup-cli.sh regen-source --plain-progress -f --strict

      # The analyzers first, and not as a nicety. tMLMod.targets references
      # Libraries/tModCodeAssist/1.0.0/tModCodeAssist.dll when it compiles any
      # mod, and building Terraria.csproj does not produce it; tModLoader's own
      # workflow builds these two ahead of it for the same reason. Skipped, the
      # result looks like a complete install and then fails CS0006 on the first
      # mod built against it.
      - name: Build tModLoader
        working-directory: tModLoader
        run: |
          dotnet build tModCodeAssist/tModCodeAssist/tModCodeAssist.csproj \
            -c Release --nologo -v q
          dotnet build tModCodeAssist/tModCodeAssist.CodeFixes/tModCodeAssist.CodeFixes.csproj \
            -c Release --nologo -v q
          dotnet build src/tModLoader/Terraria/Terraria.csproj \
            -c Release --nologo -v q

          # Every file a gate will reach for. The list is the check: an earlier
          # version of it omitted the analyzers and passed on a build that
          # could not compile a mod.
          test -f steam_build/tModLoader.dll
          test -f steam_build/tMLMod.targets
          test -d steam_build/Libraries/Native/Linux
          test -f steam_build/Libraries/tModCodeAssist/1.0.0/tModCodeAssist.dll
          test -f steam_build/Libraries/tModCodeAssist/1.0.0/tModCodeAssist.CodeFixes.dll

      # Where the gates expect to find things, and the layout a client needs.
      #
      # The install goes under a directory named steamapps because
      # InstallVerifier.DetectPlatform answers Steam when the working directory
      # contains that word, and otherwise looks for a Terraria executable to
      # hash against the version it expects. That is the branch a real Steam
      # install takes and the one this project has always depended on; taking
      # it deliberately here is what lets a build run without a Terraria to
      # verify. If this ever stops working the symptom is a fatal error naming
      # a version it could not match.
      #
      # The stub beside it is the whole of the content a client needs: two
      # empty files at the paths the startup check tests for and never reads.
      # Never do this on top of a real installation.
      #
      # MODS_SRC needs no special value, because a source build reports the Dev
      # purpose and writes its .tmod where a dev install would, but the
      # directory has to exist before the first build writes into it.
      - name: Lay out the install and a stub Terraria
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/steamapps/common"
          mv tModLoader/steam_build "${GITHUB_WORKSPACE}/steamapps/common/tModLoader"

          stub="${GITHUB_WORKSPACE}/steamapps/common/Terraria/Content/Images"
          mkdir -p "$stub"
          : > "$stub/Projectile_651.xnb"
          : > "$stub/Projectile_981.xnb"

          echo "TML_PATH=${GITHUB_WORKSPACE}/steamapps/common/tModLoader" >> "$GITHUB_ENV"
          echo "EXAMPLEMOD_SRC=${GITHUB_WORKSPACE}/tModLoader/ExampleMod" >> "$GITHUB_ENV"
          echo "MODS_SRC=${HOME}/.local/share/Terraria/tModLoader-dev/Mods" >> "$GITHUB_ENV"
          mkdir -p "${HOME}/.local/share/Terraria/tModLoader-dev/Mods"

      # Preflight, provision ExampleMod, run every gate strictly, keep the
      # reports. The lock and the commit history it keeps are harmless here: a
      # runner is alone on its filesystem and its checkout is always the commit
      # under test.
      - name: Run the gates
        working-directory: Testaria
        run: scripts/ci-local.sh --runs-dir "${GITHUB_WORKSPACE}/ci-runs"

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-tier-run
          path: ci-runs/
          if-no-files-found: error
