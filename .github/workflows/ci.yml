name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    # Testaria has to run wherever Terraria does, and the portability rules in
    # PortableFileName are asserted rather than observed, so assert them on all
    # three. Path.GetInvalidFileNameChars alone differs enough between Linux
    # and Windows to let a broken name through on one and not the other.
    name: Core and self-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Testaria.Core carries no tModLoader reference, so its own tests need
      # nothing but the SDK. Tiers 1 and above will need a tModLoader install
      # and get their own job once the toolchain question in PLAN.md is settled.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
